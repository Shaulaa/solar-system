<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tata Surya Interaktif</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="is-intro">
    <!-- Loading screen. Sengaja ada di HTML (bukan dibuat JS) biar langsung nutup layar dari awal -->
    <div class="loading" id="loading" role="status" aria-live="polite">
      <p class="loading-title">Tata Surya</p>
      <div class="loading-bar" aria-hidden="true"><span class="loading-fill" id="loading-fill"></span></div>
      <p class="loading-percent"><span id="loading-percent">0</span>%</p>
    </div>

    <canvas id="scene"></canvas>

    <div class="hud">
      <h1>Tata Surya</h1>
      <p class="sub">Klik planet buat lihat detail, drag buat muter, scroll buat zoom</p>
    </div>

    <!-- Toolbar waktu dan tampilan. Dihubungkan di ui/toolbar.js -->
    <div class="toolbar" id="toolbar" role="toolbar" aria-label="Kontrol simulasi">
      <button class="tb-btn" type="button" data-action="play" aria-label="Jeda simulasi" data-tooltip="Jeda (Spasi)">
        <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" /></svg>
        <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" /></svg>
      </button>

      <div class="tb-speed" data-tooltip="Kecepatan waktu (1 sampai 4)">
        <input
          type="range"
          id="speed"
          min="0"
          max="3"
          step="1"
          value="1"
          aria-label="Kecepatan waktu"
        />
        <output class="tb-speed-label" id="speed-label" for="speed"></output>
      </div>

      <time class="tb-date" id="sim-date"></time>

      <span class="tb-sep" aria-hidden="true"></span>

      <button class="tb-btn" type="button" data-action="orbits" aria-pressed="true" aria-label="Garis orbit" data-tooltip="Garis orbit (O)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="10" ry="5.5" transform="rotate(-24 12 12)" /><circle cx="12" cy="12" r="2.2" /><circle class="icon-fill" cx="20.2" cy="8.4" r="1.6" /></svg>
      </button>
      <button class="tb-btn" type="button" data-action="labels" aria-pressed="true" aria-label="Label nama" data-tooltip="Label nama (L)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1 1 0 0 1 0 1.4l-7.3 7.3a1 1 0 0 1-1.4 0z" /><circle cx="8" cy="8" r="1.4" /></svg>
      </button>
      <button class="tb-btn" type="button" data-action="scale" aria-pressed="false" aria-label="Skala nyata" data-tooltip="Skala nyata (S)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15.5 15.5 3 21 8.5 8.5 21z" /><path d="m7 12 2 2M10 9l2 2M13 6l2 2" /></svg>
      </button>
      <button class="tb-btn" type="button" data-action="tour" disabled aria-label="Tur otomatis, belum tersedia" data-tooltip="Tur otomatis (segera hadir)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="m15.5 8.5-2 5-5 2 2-5z" /></svg>
      </button>
    </div>

    <p class="scale-note" id="scale-note" hidden>
      Ini perbandingan asli. Planet sekecil ini dibanding jarak antar orbitnya
    </p>

    <!-- Panel info benda langit. Isinya diisi ui/infoPanel.js dari data/planets.js -->
    <aside class="info-panel" id="info-panel" aria-labelledby="info-title" hidden>
      <button class="info-back" type="button" data-action="back" aria-label="Kembali ke tampilan tata surya">
        <span aria-hidden="true">&larr;</span> Kembali
      </button>

      <header class="info-header">
        <p class="info-subtitle" id="info-subtitle" data-animate></p>
        <h2 class="info-title" id="info-title" data-animate></h2>
      </header>

      <dl class="info-stats" id="info-stats"></dl>

      <div class="info-fact" data-animate>
        <p class="info-fact-label">Fakta unik</p>
        <p class="info-fact-text" id="info-fact"></p>
      </div>

      <nav class="info-nav" aria-label="Navigasi benda langit">
        <button type="button" data-action="prev" id="info-prev"></button>
        <button type="button" data-action="next" id="info-next"></button>
      </nav>
    </aside>

    <p class="credit">
      Textures by
      <a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noopener noreferrer">Solar System Scope</a>
      (<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a>)
    </p>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
